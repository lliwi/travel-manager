{# Lo que se pregunta de un viaje que nace del buscador, en las dos pantallas
   desde las que puede nacer: el proyecto es obligatorio en cualquiera, y una
   que no lo pidiera crearía viajes que la otra rechaza. #}
            <div class="card-body border-bottom">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="seleccion-proyecto" class="form-label">Proyecto</label>
                        <input type="text" name="proyecto" id="seleccion-proyecto"
                               class="form-control form-control-sm" maxlength="120"
                               placeholder="P-2026-014" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check mb-1">
                            <input type="checkbox" name="facturable" value="1"
                                   id="seleccion-facturable" class="form-check-input">
                            <label for="seleccion-facturable"
                                   class="form-check-label">Facturable</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="seleccion-notas" class="form-label">Notas</label>
                        <textarea name="observaciones" id="seleccion-notas" rows="1"
                                  class="form-control form-control-sm"
                                  placeholder="Lo que convenga saber del viaje"></textarea>
                    </div>
                </div>
            </div>
