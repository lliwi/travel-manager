name: travel-manager

# Two networks on purpose: only nginx is reachable from outside, and the
# datastores sit on an internal network with no published ports at all.
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  clamav_data:
    driver: local
  app_logs:
    driver: local

services:
  # ------------------------------------------------------------------
  # Datastores
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: travelmanager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_manager}
      POSTGRES_USER: ${POSTGRES_USER:-travel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definida}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-travel} -d ${POSTGRES_DB:-travel_manager}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: travelmanager_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD debe estar definida}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    environment:
      # Compose interpolates the password into the command above, but the
      # healthcheck runs *inside* the container and needs it in the environment.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Pinned to a release tag: MinIO no longer publishes `latest` on Docker
    # Hub, and a floating tag on the store that holds every document is not
    # something to leave to chance anyway.
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: travelmanager_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY debe estar definida}
    volumes:
      - minio_data:/data
    networks: [backend]
    # The console is published on loopback only: it is an administrative
    # interface, not part of the application.
    ports:
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  clamav:
    image: clamav/clamav:stable
    container_name: travelmanager_clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start downloads the signature database, which takes minutes.
      start_period: 300s

  # ------------------------------------------------------------------
  # Application
  # ------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/flask/Dockerfile
    container_name: travelmanager_web
    restart: unless-stopped
    command: >
      gunicorn
      --config /app/docker/flask/gunicorn.conf.py
      --workers ${GUNICORN_WORKERS:-4}
      --bind 0.0.0.0:5000
      --timeout ${WEB_REQUEST_TIMEOUT:-180}
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
      --forwarded-allow-ips '*'
      wsgi:app
    environment: &app_env
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: wsgi.py
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY debe estar definida}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY debe estar definida}
      SECRETS_ENCRYPTION_KEY_PREVIOUS: ${SECRETS_ENCRYPTION_KEY_PREVIOUS:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      # Lo fija ./start.sh según el certificado que encuentre, para que la
      # aplicación y Nginx no tomen decisiones distintas sobre lo mismo.
      FORCE_HTTPS: ${FORCE_HTTPS:-true}

      # El mismo número con el que arranca Gunicorn arriba. La aplicación lo
      # necesita para recortar sus llamadas salientes antes de que el servidor
      # mate al worker: si se cambia uno hay que cambiar el otro, y por eso
      # los dos leen esta variable.
      WEB_REQUEST_TIMEOUT: ${WEB_REQUEST_TIMEOUT:-180}

      # Where the Gunicorn workers pool their counters so a scrape sees all
      # four rather than whichever one answered. On tmpfs: these files are
      # rebuilt on every start and must not survive a restart.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # Proxy de salida, para un servidor que no alcanza internet directamente.
      # Lo normal es configurarlo en Ajustes, que manda sobre esto; estas
      # variables son la alternativa para quien prefiera fijarlo en el
      # despliegue, y las respeta también cualquier otra herramienta de la
      # imagen. NO_PROXY trae ya lo interno: sin eso, la inferencia local
      # saldría por el proxy el día que se configure uno.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,postgres,redis,minio,openldap,mailpit,web,worker}
      # El proxy corporativo suele reemitir los certificados con su propia
      # autoridad. Apunte esto al paquete de CA de su organización si es el
      # caso; Python y httpx lo respetan sin más configuración.
      SSL_CERT_FILE: ${SSL_CERT_FILE:-}

      DATABASE_URL: postgresql://${POSTGRES_USER:-travel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-travel_manager}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/3

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-travel-documents}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-travel-quarantine}

      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      ANTIVIRUS_BACKEND: ${ANTIVIRUS_BACKEND:-clamav}

      # The AI provider is configured in the application, not here. These two
      # only seed the first configuration on a fresh install; afterwards they
      # are ignored and the panel is the source of truth. Ollama runs on the
      # host, not in this compose file.
      OLLAMA_BOOTSTRAP_URL: ${OLLAMA_BOOTSTRAP_URL:-http://host.docker.internal:11434}
      OLLAMA_BOOTSTRAP_MODEL: ${OLLAMA_BOOTSTRAP_MODEL:-llama3.1:8b}

      OCR_LANGUAGES: ${OCR_LANGUAGES:-spa+eng}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Madrid}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-33554432}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_STDOUT: 'true'
      LOG_JSON: ${LOG_JSON:-true}
    volumes:
      - app_logs:/app/logs
    networks: [frontend, backend]
    # Lets the container reach Ollama on the host, on Linux as well as on
    # Docker Desktop.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: docker/celery/Dockerfile
    container_name: travelmanager_worker
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app.celery worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_CONCURRENCY:-2}
      --max-tasks-per-child=100
    environment: *app_env
    volumes:
      - app_logs:/app/logs
    # On `frontend` as well as `backend`: the worker is what calls the AI
    # provider and fetches the allow-listed public sources, and `backend` is
    # internal, so on it alone the worker has no route off the Docker bridge at
    # all. It was silently failing every extraction. It publishes no ports, so
    # this grants outbound access without exposing anything inbound; the
    # datastores stay on `backend` only.
    networks: [frontend, backend]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ['CMD-SHELL', 'celery -A app.tasks.celery_app.celery inspect ping -d celery@$$HOSTNAME || exit 1']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  beat:
    build:
      context: ..
      dockerfile: docker/celery/Dockerfile
    container_name: travelmanager_beat
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app.celery beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --schedule=/tmp/celerybeat-schedule
    environment: *app_env
    networks: [backend]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: travelmanager_nginx
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      # Montado y no copiado en la imagen: lo escribe ./start.sh según el
      # certificado que encuentre, y así cambiar de autofirmado a uno real no
      # obliga a reconstruir nada.
      - ./nginx/tls_redirect.conf:/etc/nginx/conf.d/tls_redirect.conf:ro
    networks: [frontend]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
