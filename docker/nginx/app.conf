upstream travel_app {
    server web:5000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    # Health probes answer over plain HTTP so an orchestrator can reach them
    # without a certificate.
    location = /healthz {
        proxy_pass http://travel_app;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://travel_app;
        access_log off;
    }

    # Everything else is redirected to TLS when it is configured. Comment the
    # redirect out for a local HTTP-only development stack.
    location / {
        # return 301 https://$host$request_uri;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }

    location /static/ {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }
}
