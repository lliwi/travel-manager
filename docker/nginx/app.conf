upstream travel_app {
    server web:5000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    # Health probes answer over plain HTTP so an orchestrator can reach them
    # without a certificate.
    location = /healthz {
        proxy_pass http://travel_app;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://travel_app;
        access_log off;
    }

    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://travel_app;
        access_log off;
    }

    # Everything else is redirected to TLS when it is configured. Comment the
    # redirect out for a local HTTP-only development stack.
    location / {
        # return 301 https://$host$request_uri;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Operational data -- how many trips, users and documents exist, and how
    # the pipeline is doing. Not secret, and not anybody's business either.
    # Denied at the edge so that being reachable never depends on remembering
    # to set a token; the application refuses it a second time on its own.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
        access_log off;
    }

    location /auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }

    location /static/ {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://travel_app;
    }
}
