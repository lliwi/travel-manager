# Superposición de desarrollo.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Diferencias respecto a producción:
#   - El código se monta desde el host y el servidor recarga al guardar.
#   - La aplicación se publica directamente; no hace falta Nginx ni TLS.
#   - PostgreSQL, Redis y MinIO publican su puerto en loopback, para poder
#     conectar herramientas locales.
#   - ClamAV no se levanta: tarda minutos en descargar firmas y en desarrollo
#     rara vez aporta. `ANTIVIRUS_BACKEND=noop` deja constancia explícita de
#     que no se está analizando nada.

services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  redis:
    ports:
      - '127.0.0.1:6379:6379'

  minio:
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

  clamav:
    # Sin réplicas: el servicio queda definido pero no se arranca.
    deploy:
      replicas: 0
    profiles: ['antivirus']

  # Buzón de pruebas: acepta cualquier correo, no entrega ninguno y los muestra
  # en su propia web. En producción se configura un servidor real desde Ajustes;
  # aquí lo que interesa es poder ver qué se habría enviado sin escribirle a
  # nadie de verdad.
  mailpit:
    image: axllent/mailpit:latest
    container_name: travelmanager_mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    networks:
      # «backend» es interna, y un puerto publicado sobre una red sin salida no
      # se alcanza desde el anfitrión: para ver el buzón hace falta «frontend»,
      # igual que para la aplicación.
      - backend
      - frontend
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z localhost 1025']
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/flask/Dockerfile
    # El recargador vigila todo el árbol del proyecto, así que escribir un test
    # reiniciaba el servidor y cortaba la petición que alguien tuviera en curso.
    # Nada de lo excluido aquí forma parte de la aplicación en ejecución.
    command: >
      flask run --host=0.0.0.0 --port=5000 --reload
      --exclude-patterns '/app/tests/*:/app/htmlcov/*:/app/logs/*:/app/docs/*'
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: '1'
      LOG_LEVEL: DEBUG
      LOG_JSON: 'false'
      ANTIVIRUS_BACKEND: noop
    volumes:
      # El código en caliente; los datos siguen en volúmenes.
      - ../app:/app/app
      - ../migrations:/app/migrations
      - ../tests:/app/tests
      # La suite comprueba las propiedades de los scripts de copia, así que
      # tienen que estar donde ella pueda leerlos.
      - ../scripts:/app/scripts
      - ../wsgi.py:/app/wsgi.py
    ports:
      - '${DEV_PORT:-5000}:5000'
    depends_on:
      clamav:
        condition: service_started
        required: false

  worker:
    command: >
      celery -A app.tasks.celery_app.celery worker
      --loglevel=debug
      --concurrency=1
    environment:
      FLASK_ENV: development
      LOG_LEVEL: DEBUG
      LOG_JSON: 'false'
      ANTIVIRUS_BACKEND: noop
    volumes:
      - ../app:/app/app
      - ../migrations:/app/migrations
    depends_on:
      clamav:
        condition: service_started
        required: false

  beat:
    environment:
      FLASK_ENV: development
      LOG_JSON: 'false'
    volumes:
      - ../app:/app/app

  nginx:
    # En desarrollo se accede directamente a la aplicación.
    deploy:
      replicas: 0
    profiles: ['proxy']
