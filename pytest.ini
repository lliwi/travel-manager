[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
minversion = 7.0
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-branch
    --maxfail=5
markers =
    unit: Unit tests for individual components
    integration: Integration tests spanning several layers
    acceptance: Acceptance tests mapped to the specification section 5
    security: Authorization, isolation and hardening tests
    slow: Tests that need external services or take long to run

[coverage:run]
branch = True
source = app
omit =
    app/*/migrations/*
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    if __name__ == .__main__.:
